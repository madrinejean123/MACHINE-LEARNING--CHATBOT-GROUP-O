name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Exclude data/ from Space sync
        run: |
          git rm -r --cached data || true
          echo "data/" >> .gitignore
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .gitignore
          git commit -m "Exclude data/ from Space sync" || echo "No changes to commit"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://madrine:${HF_TOKEN}@huggingface.co/spaces/madrine/safeguarding-companion main:main
